<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
    <!-- Circular luxury emblem -->
    <circle cx="60" cy="60" r="58" fill="#FAF8F5" stroke="#2A1E17" stroke-width="1.8"/>
    <circle cx="60" cy="60" r="52" fill="none" stroke="#C4A47C" stroke-width="1" stroke-dasharray="2 3"/>
    
    <!-- Outer ring circular text or accents -->
    <polygon points="60,14 62,18 60,22 58,18" fill="#C4A47C"/>
    <polygon points="60,98 62,102 60,106 58,102" fill="#C4A47C"/>
    <polygon points="18,60 22,58 26,60 22,62" fill="#C4A47C"/>
    <polygon points="94,60 98,58 102,60 98,62" fill="#C4A47C"/>

    <!-- CW monogram centered -->
    <g transform="translate(6, 4)">
        <path d="M 52 38 C 42 35 32 42 32 56 C 32 70 42 77 54 74 C 58 72 60 70 61 67" 
