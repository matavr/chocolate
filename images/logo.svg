<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" fill="none">
    <!-- Luxury Emblem Monogram CW -->
    <g transform="translate(4, 6)">
        <!-- Outer refined geometric frame -->
        <rect x="0.5" y="0.5" width="59" height="59" rx="12" stroke="#2A1E17" stroke-width="1.2" fill="#FAF8F5"/>
        <rect x="3.5" y="3.5" width="53" height="53" rx="10" stroke="#C4A47C" stroke-width="0.8" opacity="0.6"/>
        
        <!-- Elegant interlocking CW lettermark -->
        <path d="M 33 20 C 27 18 20 22 20 30 C 20 38 27 42 34 40 C 36 39 37.5 37.5 38 36" 
              stroke="#2A1E17" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path d="M 28 24 L 32.5 39 L 36.5 28 L 40.5 39 L 45 24" 
              stroke="#4E382C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        
        <!-- Micro diamond accent -->
        <polygon points="30,12 32,15 30,18 28,15" fill="#C4A47C"/>
    </g>

    <!-- Typography: CHOCOLATE WHITE -->
    <g transform="translate(80, 24)">
        <text x="0" y="14" font-family="'Tenor Sans', 'Plus Jakarta Sans', -apple-system, sans-serif" 
              font-size="20" font-weight="400" letter-spacing="5.5" fill="#1C1613">CHOCOLATE WHITE</text>
        <text x="1.5" y="31" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
              font-size="8" font-weight="500" letter-spacing="3.8" fill="#75675E">KARAGANDA • LUXURY BOUTIQUE</text>
    </g>
</svg>
