<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" fill="none">
    <!-- Luxury Emblem Monogram C -->
    <g transform="translate(4, 6)">
        <rect x="0.5" y="0.5" width="59" height="59" rx="12" stroke="#2A1E17" stroke-width="1.2" fill="#FAF8F5"/>
        <rect x="3.5" y="3.5" width="53" height="53" rx="10" stroke="#C4A47C" stroke-width="0.8" opacity="0.6"/>
        
        <!-- Elegant C Lettermark -->
        <path d="M 42 22 C 34 17 22 21 22 35.5 C 22 50 34 54 42 49 C 45 47 46.5 45 47 43" 
              stroke="#2A1E17" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <path d="M 39 26 C 33 22 26 25 26 35.5 C 26 46 33 49 39 45" 
              stroke="#4E382C" stroke-width="1.6" stroke-linecap="round" fill="none"/>
        
        <!-- Diamond accent -->
        <polygon points="30,12 32,15 30,18 28,15" fill="#C4A47C"/>
    </g>

    <!-- Typography: CHOCOLATE -->
    <g transform="translate(80, 24)">
        <text x="0" y="14" font-family="'Syne', 'Tenor Sans', -apple-system, sans-serif" 
              font-size="22" font-weight="600" letter-spacing="5" fill="#1C1613">CHOCOLATE</text>
        <text x="1.5" y="31" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
              font-size="8.5" font-weight="600" letter-spacing="3.5" fill="#75675E">KARAGANDA • BOUTIQUE</text>
    </g>
</svg>
